; platformio.ini — HoloTamagotchi 韌體（M5Stack Fire / Arduino C++ / M5Unified）
;
; 由 UIFlow1 MicroPython 遷移而來。核心變更：用 M5GFX 的 M5Canvas 做全螢幕雙緩衝，
; 每幀在記憶體（PSRAM）拼好整張畫面再一次 pushSprite，根治原本 lcd.image 逐列
; 更新（掃描線）的問題。Fire 內建 4MB PSRAM，足以容納 320x240x16bpp(150KB) canvas。
;
; 素材不再編進韌體：由 tools/build_fs_assets.py 把 PNG 轉成 RGB565 放進 data/，
; 打包成 LittleFS 映像燒到獨立 data 分區，開機由 AssetStore 載入 PSRAM。
; 換美術只需重產素材分區、單獨 uploadfs，不必重編韌體。
;
; 建置 / 上板 / 看序列：
;   pio run                 編譯韌體（邏輯有改才需要）
;   pio run -t upload       燒錄韌體
;   pio run -t buildfs      把 data/ 打包成 LittleFS 映像（換美術前先跑轉檔工具）
;   pio run -t uploadfs     燒錄素材分區（換美術只需這步）
;   pio device monitor      看 Serial（對應原本的 print() debug）

[env:m5stack-fire]
platform = espressif32
board = m5stack-fire
framework = arduino
monitor_speed = 115200
upload_speed = 1500000

; 16MB flash 內建分區表，含一個 ~3.4MB 的 data 分區（label spiffs，offset 0xc90000）
; 當作 LittleFS 用——素材映像就燒在這裡（官網 esptool 也是燒這個 offset）。
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

lib_deps =
    m5stack/M5Unified@^0.2.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
